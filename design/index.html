<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>yumeship — design system</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html,
    body {
      margin: 0;
      background: #f0eee9;
    }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
    }

    /* ── Cover ─────────────────────────────── */
    .ys-cover {
      background: linear-gradient(160deg, #fde0ce 0%, #fadde5 50%, #ece4f7 100%);
      padding: 40px 56px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      color: var(--ink);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }

    .ys-cover-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--sakura-deep);
      text-transform: uppercase;
      font-weight: 600;
    }

    .ys-cover-mark-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 2px;
    }

    .ys-cover-title {
      font-family: var(--font-display);
      font-size: 108px;
      line-height: 0.92;
      letter-spacing: -0.03em;
      font-style: italic;
      color: var(--ink);
    }

    .ys-cover-ja {
      font-family: var(--font-ja);
      font-size: 22px;
      color: var(--ink-2);
      letter-spacing: 0.12em;
    }

    .ys-cover-tagline {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 22px;
      line-height: 1.35;
      color: var(--ink-2);
      max-width: 620px;
    }

    .ys-cover-meta {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      position: relative;
      z-index: 2;
    }

    .ys-cover-meta dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 16px;
      font-size: 12px;
    }

    .ys-cover-meta dt {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.12em;
      color: var(--sakura-deep);
      text-transform: uppercase;
      align-self: center;
      font-weight: 600;
    }

    .ys-cover-meta dd {
      margin: 0;
      color: var(--ink);
    }

    .ys-cover-decor {
      position: absolute;
      pointer-events: none;
    }

    /* ── Section note tile ───────────────── */
    .ys-section-note {
      width: 100%;
      height: 100%;
      padding: 28px;
      background: linear-gradient(170deg, var(--vellum), var(--sakura-soft));
      border-radius: 18px;
      border: 1px solid var(--sakura);
      display: flex;
      flex-direction: column;
      gap: 14px;
      color: var(--ink);
      position: relative;
      overflow: hidden;
    }

    .ys-section-note h3 {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 26px;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .ys-section-note p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--ink-2);
      margin: 0;
    }

    .ys-section-note .eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--sakura-deep);
      text-transform: uppercase;
      font-weight: 600;
    }

    .ys-section-note ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ys-section-note ul li {
      display: flex;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-2);
      line-height: 1.4;
    }

    .ys-section-note ul li::before {
      content: "♡";
      color: var(--sakura-deep);
      font-size: 10px;
      flex-shrink: 0;
      margin-top: 2px;
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="deco.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="cards.jsx"></script>
  <script type="text/babel" src="spec.jsx"></script>
  <script type="text/babel" src="template-pages.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const {
      DesignCanvas, DCSection, DCArtboard, DCPostIt,
      // foundation
      YS_Brand, YS_Color, YS_Type, YS_Spacing, YS_Buttons, YS_Inputs,
      // domain components
      YS_FOCardSection, YS_ContentCards, YS_Messages, YS_Timeline,
      YS_Notifications, YS_Moodboard, YS_Navigation,
      // spec-aligned components
      YS_SubTabBarSection, YS_HeadcanonsSection, YS_PlaylistSection,
      YS_AestheticBoardSection, YS_PolyculeSection,
      YS_UpcomingSection, YS_SettingsSection, YS_ThreadsSection,
      // templates
      YS_TemplatesGallery, YS_TemplateFiller, YS_TemplateResult,
      // template pages (community-style fill-in sheets)
      YS_T_GetToKnow, YS_T_KawaiiUI, YS_T_HeartFrame,
      YS_T_Aesthetic, YS_T_ThisOrThat, YS_T_Boundaries,
      YS_T_LoveLetter, YS_T_Storyline, YS_T_Headcanons,
      // screens
      YS_ScreenHome, YS_ScreenDetail, YS_ScreenMessages,
      YS_ScreenUpcoming, YS_ScreenSettings,
      // deco primitives
      YS_Mark, YS_Heart, YS_Sparkle, YS_SparkleCluster,
      YS_Sakura, YS_Ribbon, YS_Star, YS_SakuraConfetti,
      YS_WashiTape, YS_Seal,
    } = window;

    function Cover() {
      return (
        <div className="ys-cover" data-screen-label="00 Cover">
          {/* confetti bg */}
          <div className="ys-cover-decor" style={{
            top: 0, right: 0, width: 380, height: 380, opacity: 0.6,
          }}>
            <YS_SakuraConfetti />
          </div>

          {/* washi tape — top */}
          <div className="ys-cover-decor" style={{ top: 14, left: 80 }}>
            <YS_WashiTape width={180} height={22} pattern="heart" color="var(--sakura-deep)" rotate={-3} />
          </div>

          {/* big seal stamp */}
          <div className="ys-cover-decor" style={{ top: 220, right: 80 }}>
            <YS_Seal size={120} color="var(--plum)" ja="夢" label="yumeship" rotate={-12} />
          </div>

          {/* floating ribbon */}
          <div className="ys-cover-decor" style={{ bottom: 40, right: 260 }}>
            <YS_Ribbon size={40} color="var(--sakura-deep)" />
          </div>

          <div className="ys-cover-eyebrow" style={{ marginTop: 30, position: "relative", zIndex: 2 }}>
            ♡ yumeship · design system v0.2 · kawaii edition
          </div>

          <div className="ys-cover-mark-row" style={{ position: "relative", zIndex: 2 }}>
            <YS_Mark size={64} />
            <YS_Sakura size={28} />
            <YS_Sparkle size={14} color="var(--sakura-deep)" />
          </div>

          <h1 className="ys-cover-title" style={{ position: "relative", zIndex: 2 }}>yumeship</h1>
          <div className="ys-cover-ja" style={{ position: "relative", zIndex: 2 }}>
            夢 ・ ゆめしっぷ ・ a private scrapbook for your F/O
          </div>
          <p className="ys-cover-tagline" style={{ position: "relative", zIndex: 2 }}>
            "A quiet place to keep them. Headcanons, outfits, the scenes you imagined this morning — held close, like a letter you never sent."
          </p>

          <div className="ys-cover-meta">
            <dl>
              <dt>For</dt><dd>yumeshippers · selfshippers · OC × canon</dd>
              <dt>Voice</dt><dd>gently devotional, treats it as real</dd>
              <dt>Type</dt><dd>Instrument Serif · DM Sans · Klee One</dd>
              <dt>Model</dt><dd>4 root tabs · 7 detail sub-tabs · 9 templates</dd>
              <dt>Stack</dt><dd>21 components · 8 sentiment colors · 5 in-context screens</dd>
            </dl>
            <div style={{
              fontFamily: "var(--font-mono)",
              fontSize: 11, color: "var(--sakura-deep)",
              textAlign: "right", lineHeight: 1.6,
              letterSpacing: "0.06em",
              fontWeight: 600,
            }}>
              2026.05.25<br />
              v0.2 · "kawaii"
            </div>
          </div>
        </div>
      );
    }

    function ScreensNote() {
      return (
        <div className="ys-section-note">
          <div style={{ position: "absolute", top: -8, left: 32 }}>
            <YS_WashiTape width={70} height={16} pattern="heart" color="var(--sakura-deep)" rotate={-6} />
          </div>
          <div style={{ position: "absolute", top: 10, right: 12 }}>
            <YS_Heart size={16} color="var(--sakura-deep)" />
          </div>
          <span className="eyebrow">✶ in context</span>
          <h3>The system, breathing.</h3>
          <p>
            Five screens spanning the four root tabs. Each one shows the kawaii grammar in practice — washi tape, sparkle accents, plum seals, sakura confetti, soft sherbet gradients.
          </p>
          <ul>
            <li>Home: F/O grid with pin + polycule</li>
            <li>Detail: profile + 7-sub-tab scroller</li>
            <li>Messages: bubbles + side toggle (me/them)</li>
            <li>Upcoming: anniversary days-until</li>
            <li>Settings: lock · notifs · data · pro</li>
          </ul>
          <div style={{
            marginTop: "auto", display: "flex", alignItems: "center", gap: 6,
            color: "var(--sakura-deep)", fontSize: 10,
            fontFamily: "var(--font-mono)", letterSpacing: "0.1em", fontWeight: 600,
          }}>
            <YS_Sparkle size={10} color="var(--sakura-deep)" />
            340 × 720 · iOS
          </div>
        </div>
      );
    }

    function App() {
      return (
        <DesignCanvas>
          <DCSection id="cover" title="Cover" subtitle="brand · vision · scope">
            <DCArtboard id="cover" label="Cover" width={920} height={700}>
              <Cover />
            </DCArtboard>
            <DCArtboard id="brand" label="01 · Brand" width={820} height={420}>
              <YS_Brand />
            </DCArtboard>
          </DCSection>

          <DCSection id="foundations" title="Foundations" subtitle="color · type · spacing">
            <DCArtboard id="color" label="02 · Palette" width={920} height={920}>
              <YS_Color />
            </DCArtboard>
            <DCArtboard id="type" label="03 · Type" width={1040} height={620}>
              <YS_Type />
            </DCArtboard>
            <DCArtboard id="spacing" label="04 · Spacing · Radii · Shadow" width={920} height={520}>
              <YS_Spacing />
            </DCArtboard>
          </DCSection>

          <DCSection id="controls" title="Controls" subtitle="buttons · forms · chips">
            <DCArtboard id="buttons" label="05 · Buttons" width={760} height={520}>
              <YS_Buttons />
            </DCArtboard>
            <DCArtboard id="inputs" label="06 · Forms · type · sharing · polycule" width={560} height={760}>
              <YS_Inputs />
            </DCArtboard>
          </DCSection>

          <DCSection id="ship" title="The ship" subtitle="F/O card · navigation · sub-tabs">
            <DCArtboard id="focard" label="07 · F/O card" width={760} height={720}>
              <YS_FOCardSection />
            </DCArtboard>
            <DCArtboard id="content" label="08 · Content cards" width={1040} height={520}>
              <YS_ContentCards />
            </DCArtboard>
            <DCArtboard id="navigation" label="13 · Nav · menus" width={760} height={520}>
              <YS_Navigation />
            </DCArtboard>
            <DCArtboard id="subtabs" label="14 · Detail sub-tabs" width={920} height={360}>
              <YS_SubTabBarSection />
            </DCArtboard>
          </DCSection>

          <DCSection id="profile" title="Profile depth" subtitle="headcanons · playlist · aesthetic board · polycule">
            <DCArtboard id="headcanons" label="15 · Headcanons" width={920} height={580}>
              <YS_HeadcanonsSection />
            </DCArtboard>
            <DCArtboard id="playlist" label="16 · Playlist" width={620} height={580}>
              <YS_PlaylistSection />
            </DCArtboard>
            <DCArtboard id="aesthetic" label="17 · Aesthetic board" width={520} height={580}>
              <YS_AestheticBoardSection />
            </DCArtboard>
            <DCArtboard id="polycule" label="18 · Polycule" width={820} height={520}>
              <YS_PolyculeSection />
            </DCArtboard>
          </DCSection>

          <DCSection id="comms" title="Communication" subtitle="messages · threads · storyline · notifications">
            <DCArtboard id="threads" label="21 · Threads" width={620} height={520}>
              <YS_ThreadsSection />
            </DCArtboard>
            <DCArtboard id="messages" label="09 · Messages" width={620} height={620}>
              <YS_Messages />
            </DCArtboard>
            <DCArtboard id="timeline" label="10 · Storyline" width={720} height={620}>
              <YS_Timeline />
            </DCArtboard>
            <DCArtboard id="notifs" label="11 · Notifications" width={560} height={520}>
              <YS_Notifications />
            </DCArtboard>
            <DCArtboard id="moodboard" label="12 · Album" width={620} height={520}>
              <YS_Moodboard />
            </DCArtboard>
          </DCSection>

          <DCSection id="global" title="Upcoming & Settings" subtitle="tab 3 · tab 4">
            <DCArtboard id="upcoming" label="19 · Upcoming" width={640} height={560}>
              <YS_UpcomingSection />
            </DCArtboard>
            <DCArtboard id="settings" label="20 · Settings" width={920} height={640}>
              <YS_SettingsSection />
            </DCArtboard>
          </DCSection>

          <DCSection id="templates" title="Templates" subtitle="9 fill-in cards → scrapbook page">
            <DCArtboard id="templates-gallery" label="22 · Templates" width={920} height={700}>
              <YS_TemplatesGallery />
            </DCArtboard>
            <DCArtboard id="filler" label="23 · Filler" width={920} height={620}>
              <YS_TemplateFiller />
            </DCArtboard>
            <DCArtboard id="result" label="24 · Result card" width={720} height={620}>
              <YS_TemplateResult />
            </DCArtboard>
          </DCSection>

          <DCSection id="template-pages" title="Template pages" subtitle="community visual language — 9 styles, fillable sheets">
            <DCArtboard id="tp-getto" label="@reversiblekisses · marker" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_GetToKnow /></div>
            </DCArtboard>
            <DCArtboard id="tp-kawaii" label="@cherrypopstamp · kawaii UI" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_KawaiiUI /></div>
            </DCArtboard>
            <DCArtboard id="tp-heart" label="@bunny.thoughts · heart" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_HeartFrame /></div>
            </DCArtboard>
            <DCArtboard id="tp-aesthetic" label="@cloudbloom.kr · aesthetic" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_Aesthetic /></div>
            </DCArtboard>
            <DCArtboard id="tp-thisthat" label="@softfangs · this or that" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_ThisOrThat /></div>
            </DCArtboard>
            <DCArtboard id="tp-bound" label="@petalpressed · boundaries" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_Boundaries /></div>
            </DCArtboard>
            <DCArtboard id="tp-letter" label="@inkdrop.diary · love letter" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_LoveLetter /></div>
            </DCArtboard>
            <DCArtboard id="tp-story" label="@plumstamps · storyline" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_Storyline /></div>
            </DCArtboard>
            <DCArtboard id="tp-hc" label="@daydreamr · headcanons" width={560} height={880}>
              <div style={{ padding: 20, display: "grid", placeItems: "center", width: "100%", height: "100%", background: "#f0eee9" }}><YS_T_Headcanons /></div>
            </DCArtboard>
          </DCSection>

          <DCSection id="screens" title="In context" subtitle="five screens · four root tabs · seven sub-tabs">
            <DCArtboard id="screens-note" label="overview" width={300} height={720}>
              <ScreensNote />
            </DCArtboard>
            <DCArtboard id="home" label="Home · ships" width={340} height={720}>
              <YS_ScreenHome />
            </DCArtboard>
            <DCArtboard id="detail" label="F/O · detail" width={340} height={720}>
              <YS_ScreenDetail />
            </DCArtboard>
            <DCArtboard id="messages-screen" label="Messages" width={340} height={720}>
              <YS_ScreenMessages />
            </DCArtboard>
            <DCArtboard id="upcoming-screen" label="Upcoming" width={340} height={720}>
              <YS_ScreenUpcoming />
            </DCArtboard>
            <DCArtboard id="settings-screen" label="Settings" width={340} height={720}>
              <YS_ScreenSettings />
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
